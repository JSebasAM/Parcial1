<div class="main-container">

  <app-header
    [badge]="datosHeader.badge"
    [titulo]="datosHeader.titulo"
    [descripcion]="datosHeader.descripcion">
  </app-header>

  <section class="content-section">
    <div class="section-header">
      <h2>Pilares del Sistema de Diseño</h2>
      <p>Los elementos fundamentales que soportan la arquitectura de una interfaz de usuario escalable.</p>
    </div>

    <div class="cards-grid">
      <app-card
        *ngFor="let card of listaTarjetas; let i = index"
        [numero]="i + 1"
        [titulo]="card.titulo"
        [descripcion]="card.descripcion"
        [beneficios]="card.beneficios"
        [ejemplo]="card.ejemplo">
      </app-card>
    </div>
  </section>

  <app-footer></app-footer>

</div>
